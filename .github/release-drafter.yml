# Config for release-drafter (.github/workflows/release-drafter.yml). Drafts
# release notes on every push to master by categorizing merged PRs from
# their labels, so release_automation's tag-triggered release (see
# release.yml) has real, human-reviewed notes ready instead of an empty body.
name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'

categories:
  - title: '🚀 Features'
    labels:
      - 'feature'
      - 'enhancement'
  - title: '🐛 Bug Fixes'
    labels:
      - 'fix'
      - 'bug'
  - title: '🔒 Security'
    labels:
      - 'security'
  - title: '📦 Dependencies'
    labels:
      - 'dependencies'
  - title: '🧰 Maintenance'
    labels:
      - 'chore'
      - 'maintenance'
      - 'documentation'

change-template: '- $TITLE (#$NUMBER)'
change-title-escapes: '\<*_&' # escape specific characters in titles

version-resolver:
  major:
    labels:
      - 'major'
  minor:
    labels:
      - 'minor'
      - 'feature'
      - 'enhancement'
  patch:
    labels:
      - 'patch'
      - 'fix'
      - 'bug'
      - 'chore'
      - 'dependencies'
  default: patch

exclude-labels:
  - 'skip-changelog'

template: |
  ## What's changed

  $CHANGES

  **Full diff**: https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION
