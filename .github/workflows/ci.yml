name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Cancel superseded runs on the same branch/PR so pushes during review don't
# queue up redundant builds.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Runs first and reports in well under a minute: compilation plus every
  # static-analysis check that doesn't need a database (Spotless, Checkstyle,
  # PMD, CPD, dependency-analysis buildHealth, AGENTS.md validation, Javadoc).
  # Split out from the test job below so a formatting or lint mistake shows
  # up fast instead of waiting behind the Testcontainers-backed suite.
  fast-checks:
    name: Fast checks (lint, static analysis)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Fast checks
        run: >
          ./gradlew spotlessCheck checkstyleMain checkstyleTest pmdMain
          pmdTest cpdCheck buildHealth validateAgentsMd javadoc
          --console=plain

      - name: Upload build performance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-performance-fast-checks
          path: build/reports/build-performance/
          retention-days: 14

      # Only the lint/duplication counts are meaningful from this job (it doesn't run tests, so
      # coverage shows "not run this build" here) - the test job below uploads its own
      # complementary half with the coverage number and "not run this build" for these.
      - name: Upload code quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-quality-fast-checks
          path: build/reports/code-quality/
          retention-days: 14

  # Slower: full test suite (including the Testcontainers-backed integration
  # tests, which need Docker) plus coverage threshold enforcement. Runs in
  # parallel with fast-checks rather than after it, so this job's longer
  # runtime doesn't delay the fast feedback above.
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Docker is preinstalled on ubuntu-latest runners, which the
      # Testcontainers-backed integration tests need.
      - name: Build and test
        run: ./gradlew build -x spotlessCheck -x checkstyleMain -x checkstyleTest -x pmdMain -x pmdTest -x cpdCheck -x buildHealth -x validateAgentsMd -x javadoc --console=plain

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test/
          retention-days: 14

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: build/reports/jacoco/test/html/
          retention-days: 14

      - name: Upload build performance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-performance-test
          path: build/reports/build-performance/
          retention-days: 14

      # Complementary half of fast-checks' upload above: this job's -x flags skip
      # checkstyle/PMD/CPD, so only the coverage number is meaningful here.
      - name: Upload code quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-quality-test
          path: build/reports/code-quality/
          retention-days: 14

  # A broken master isn't something anyone should have to notice by happening to check the
  # Actions tab - post it to Slack. Scoped to push (not pull_request) so a contributor's PR
  # failing doesn't page anyone; that's already visible directly in the PR's own checks.
  notify-on-failure:
    name: Notify Slack on master failure
    needs: [fast-checks, test]
    if: always() && github.event_name == 'push' && (needs.fast-checks.result == 'failure' || needs.test.result == 'failure')
    runs-on: ubuntu-latest
    steps:
      - name: Post failure to Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_ALERTS_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then
            echo "SLACK_ALERTS_WEBHOOK_URL secret not set - skipping Slack notification." >&2
            exit 0
          fi
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          failed_job="fast-checks"
          if [ "${{ needs.test.result }}" = "failure" ]; then
            failed_job="test"
          fi
          text=":red_circle: *CI failed on master* (job: \`$failed_job\`)
          <$run_url|View run> - commit \`${{ github.sha }}\` by ${{ github.actor }}"
          payload=$(jq -n --arg text "$text" '{text: $text}')
          curl -sf -X POST -H 'Content-type: application/json' --data "$payload" "$SLACK_WEBHOOK_URL"
