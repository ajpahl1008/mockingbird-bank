name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Cancel superseded runs on the same branch/PR so pushes during review don't
# queue up redundant builds.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Runs first and reports in well under a minute: compilation plus every
  # static-analysis check that doesn't need a database (Spotless, Checkstyle,
  # PMD, CPD, dependency-analysis buildHealth, AGENTS.md validation, Javadoc).
  # Split out from the test job below so a formatting or lint mistake shows
  # up fast instead of waiting behind the Testcontainers-backed suite.
  fast-checks:
    name: Fast checks (lint, static analysis)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Fast checks
        run: >
          ./gradlew spotlessCheck checkstyleMain checkstyleTest pmdMain
          pmdTest cpdCheck buildHealth validateAgentsMd javadoc
          --console=plain

      - name: Upload build performance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-performance-fast-checks
          path: build/reports/build-performance/
          retention-days: 14

  # Slower: full test suite (including the Testcontainers-backed integration
  # tests, which need Docker) plus coverage threshold enforcement. Runs in
  # parallel with fast-checks rather than after it, so this job's longer
  # runtime doesn't delay the fast feedback above.
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Docker is preinstalled on ubuntu-latest runners, which the
      # Testcontainers-backed integration tests need.
      - name: Build and test
        run: ./gradlew build -x spotlessCheck -x checkstyleMain -x checkstyleTest -x pmdMain -x pmdTest -x cpdCheck -x buildHealth -x validateAgentsMd -x javadoc --console=plain

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test/
          retention-days: 14

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: build/reports/jacoco/test/html/
          retention-days: 14

      - name: Upload build performance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-performance-test
          path: build/reports/build-performance/
          retention-days: 14
