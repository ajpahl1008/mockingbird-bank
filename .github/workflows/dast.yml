name: DAST (OWASP ZAP baseline)

on:
  push:
    branches: [master]
  schedule:
    # Independent of code changes - catches drift from framework/config
    # changes (e.g. a security header regressing) even in a quiet week.
    - cron: "23 4 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  zap-baseline:
    name: ZAP baseline scan
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: mydatabase
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U admin -d mydatabase"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Production mode, not `bootRun`'s dev server: ZAP is scanning what a
      # real deployment serves, not Vaadin's dev-only debug tooling.
      - name: Build production jar
        run: ./gradlew -Pvaadin.productionMode=true clean bootJar -x test --console=plain

      - name: Start the app
        run: |
          nohup java -jar build/libs/*.jar > app.log 2>&1 &
          echo $! > app.pid
          for _ in $(seq 1 60); do
            if curl -sf http://localhost:8080/actuator/health 2>/dev/null | grep -q '"status":"UP"'; then
              echo "App is up."
              exit 0
            fi
            sleep 2
          done
          echo "App never became healthy:"
          cat app.log
          exit 1

      - name: ZAP baseline scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: "http://localhost:8080/login"
          cmd_options: "-a"
          # Findings need a human to triage (e.g. missing headers on a demo
          # app vs. an actual exploitable flaw) rather than block every
          # push; the report artifact below is what gets reviewed.
          fail_action: false
          # The job token only has `contents: read` (see permissions above),
          # so let the artifact upload below be the report mechanism instead
          # of granting `issues: write` just for this.
          allow_issue_writing: false

      - name: Stop the app
        if: always()
        run: kill "$(cat app.pid)" 2>/dev/null || true

      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-baseline-report
          path: |
            report_html.html
            report_md.md
            report_json.json
          retention-days: 30
