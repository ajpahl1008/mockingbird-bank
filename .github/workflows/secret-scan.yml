name: Secret scan

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Complements GitHub's native secret scanning (enabled in repo
      # settings): gitleaks runs its own, editable-locally rule set and
      # fails the PR check directly rather than only posting to the
      # Security tab, so a leaked credential blocks the merge, not just
      # gets flagged after the fact.
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
