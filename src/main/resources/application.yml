spring:
  application:
    name: mockingbird-bank
  datasource:
    url: jdbc:postgresql://localhost:5432/mydatabase
    username: admin
    password: secret
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

vaadin:
  launch-browser: true
