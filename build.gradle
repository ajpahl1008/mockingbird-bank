plugins {
    id 'java'
    id 'jacoco'
    id 'checkstyle'
    id 'pmd'
    id 'com.diffplug.spotless' version '7.0.2'
    id 'de.aaschmid.cpd' version '3.5'
    id 'org.gradle.test-retry' version '1.6.2'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.6'
    id 'com.vaadin' version '25.3.0'
}

group = 'com.mockingbirdbank'
version = '0.1.0-SNAPSHOT'
description = 'Mockingbird Bank - read-only account dashboard SPA'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.vaadin.com/vaadin-addons' }
}

dependencyManagement {
    imports {
        mavenBom "com.vaadin:vaadin-bom:25.3.0"
        // Kept in sync with the testcontainers.version Spring Boot 4.1.1
        // itself manages; io.spring.dependency-management doesn't resolve
        // that nested BOM import automatically in this setup.
        mavenBom "org.testcontainers:testcontainers-bom:2.0.5"
    }
}

dependencies {
    implementation 'com.vaadin:vaadin-spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    // Spring Boot 4 split Flyway's autoconfiguration out of the core
    // autoconfigure jar into this dedicated starter - flyway-core alone
    // no longer triggers it. Postgres dialect support is still a separate
    // Flyway artifact (unbundled since Flyway 10) and must be added too.
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-database-postgresql'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    runtimeOnly 'org.postgresql:postgresql'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    developmentOnly 'com.vaadin:vaadin-dev'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'com.vaadin:vaadin-testbench-junit5'
}

vaadin {
    // Flip to true (or set via -Pvaadin.productionMode) when building a deployable jar.
    productionMode = false
}

checkstyle {
    toolVersion = '10.20.2'
    configFile = file("${rootDir}/config/checkstyle/checkstyle.xml")
    // Errors (naming, imports, complexity, file size, etc.) still fail the build;
    // TODO/FIXME markers are reported as warnings so debt is visible without blocking work.
    maxWarnings = Integer.MAX_VALUE
    ignoreFailures = false
}

// Checkstyle only targets first-party Java sources; generated Vaadin frontend
// assets aren't Java and Lombok-generated accessors are handled at compile time.
tasks.named('checkstyleMain') {
    source = fileTree('src/main/java')
}
tasks.named('checkstyleTest') {
    source = fileTree('src/test/java')
}

// Keep the linter in the normal build/verification flow so agents see
// violations as part of `./gradlew check`/`./gradlew build`.
tasks.named('check') {
    dependsOn tasks.named('checkstyleMain'), tasks.named('checkstyleTest')
}

pmd {
    toolVersion = '7.7.0'
    ruleSetFiles = files("${rootDir}/config/pmd/dead-code.xml")
    ruleSets = []
    consoleOutput = true
    ignoreFailures = false
}

// PMD only targets first-party Java; Vaadin's generated frontend isn't Java.
tasks.named('pmdMain') {
    source = fileTree('src/main/java')
}
tasks.named('pmdTest') {
    source = fileTree('src/test/java')
}
tasks.named('check') {
    dependsOn tasks.named('pmdMain'), tasks.named('pmdTest')
}

cpd {
    toolVersion = '7.7.0'
    language = 'java'
}
cpdCheck {
    source = fileTree('src/main/java') + fileTree('src/test/java')
    // Below this, short getter/setter/builder boilerplate reads as a "duplicate"
    // even though it isn't meaningful repetition worth extracting.
    minimumTokenCount = 75
    ignoreFailures = false
}
tasks.named('check') {
    dependsOn tasks.named('cpdCheck')
}

spotless {
    java {
        target 'src/main/java/**/*.java', 'src/test/java/**/*.java'
        googleJavaFormat('1.25.2').aosp()
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
    }
}

// Fail the build on unformatted code, same as any other verification check.
tasks.named('check') {
    dependsOn tasks.named('spotlessCheck')
}

jacoco {
    toolVersion = '0.8.12'
}

jacocoTestReport {
    dependsOn tasks.named('test')
    reports {
        xml.required = true
        html.required = true
    }
}

// The Vaadin UI (com.mockingbirdbank.ui.*) is declarative view/layout code with
// no branching logic - it isn't unit-testable without a full browser fixture,
// and forcing a blanket percentage across the whole codebase would either be
// too low to mean anything or push people toward hollow tests just to hit a
// number. Instead this gates the business logic packages, which already sit
// at 94-100% line coverage today, at a real, meaningful threshold, plus a low
// project-wide floor so overall coverage can't silently regress.
jacocoTestCoverageVerification {
    dependsOn tasks.named('test')
    violationRules {
        rule {
            limit {
                counter = 'LINE'
                minimum = 0.30
            }
        }
        rule {
            element = 'CLASS'
            includes = [
                'com.mockingbirdbank.model.*',
                'com.mockingbirdbank.service.*',
                'com.mockingbirdbank.security.*',
                'com.mockingbirdbank.config.*',
            ]
            limit {
                counter = 'LINE'
                minimum = 0.90
            }
        }
    }
}
tasks.named('check') {
    dependsOn tasks.named('jacocoTestCoverageVerification')
}

// Generates the Javadoc site into build/docs/javadoc on every build and fails
// it if any @link/@see/HTML reference is actually broken (missing-tag warnings
// are allowed - not every method needs prose - but a dangling reference means
// the docs have drifted from the code and should be caught here, not shipped).
javadoc {
    title = "Mockingbird Bank ${version} API"
    source = fileTree('src/main/java')
    options {
        encoding = 'UTF-8'
        addStringOption('Xdoclint:all,-missing', '-quiet')
        links('https://docs.oracle.com/en/java/javase/21/docs/api/')
    }
    failOnError = true
}
tasks.named('check') {
    dependsOn tasks.named('javadoc')
}

// Points Git at the checked-in .githooks/pre-commit script so Spotless and
// Checkstyle run locally before a commit is even created, not just in CI.
// Runs as part of every build so a fresh clone is wired up with no manual
// `git config` step required.
tasks.register('installGitHooks') {
    group = 'verification'
    description = 'Configures Git to use the checked-in hooks in .githooks/'
    onlyIf { file('.githooks').isDirectory() && file('.git').isDirectory() }
    doLast {
        def process = ['git', 'config', 'core.hooksPath', '.githooks'].execute(null, projectDir)
        process.waitFor()
        if (process.exitValue() != 0) {
            throw new GradleException("Failed to set core.hooksPath: ${process.err.text}")
        }
    }
}
tasks.named('build') {
    dependsOn tasks.named('installGitHooks')
}

// Fails the build if AGENTS.md references a Gradle task or file/directory
// path that no longer exists, so the doc can't silently rot as the project
// evolves. See scripts/validate-agents-md.sh.
tasks.register('validateAgentsMd') {
    group = 'verification'
    description = "Checks that Gradle tasks and paths referenced in AGENTS.md still exist."
    doLast {
        def process =
                ['bash', "${rootDir}/scripts/validate-agents-md.sh"].execute(null, rootDir)
        process.consumeProcessOutput(System.out, System.err)
        process.waitFor()
        if (process.exitValue() != 0) {
            throw new GradleException(
                    'AGENTS.md references a missing Gradle task or file path - see output above.')
        }
    }
}
tasks.named('check') {
    dependsOn tasks.named('validateAgentsMd')
}

test {
    useJUnitPlatform()
    // Per-test PASSED/FAILED/SKIPPED lines (with duration) in the console output,
    // instead of only a final pass/fail summary.
    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat "full"
    }

    // Automatically re-runs a failed test up to 2 more times. A test that fails
    // once but passes on retry is flaky, not broken - failOnPassedAfterRetry
    // = false means it doesn't block the build, but every attempt still shows
    // up in the flaky-test report below so the instability itself isn't lost.
    retry {
        maxRetries = 2
        maxFailures = 10
        failOnPassedAfterRetry = false
    }
}

// Tracks per-test-method duration and writes a "slowest tests" report on every
// run, so the suite's performance is visible over time instead of only whether
// it passed. Warns (doesn't fail the build) on anything unexpectedly slow -
// the Testcontainers-backed integration tests legitimately take a few seconds
// for container startup, so a hard failure here would be noise, not signal.
def testStartNanos = new java.util.concurrent.ConcurrentHashMap()
def testDurationsMs = new java.util.concurrent.ConcurrentLinkedQueue()
def slowTestThresholdMs = 10_000L

// Records every attempt's outcome per test (test-retry re-runs a failed test,
// firing these listeners again for the same test name) so a test whose
// attempts disagree - e.g. FAILURE then SUCCESS - can be flagged as flaky
// instead of the retry silently hiding the instability.
def testAttemptOutcomes = new java.util.concurrent.ConcurrentHashMap()

tasks.named('test') {
    beforeTest { descriptor -> testStartNanos[descriptor] = System.nanoTime() }

    afterTest { descriptor, result ->
        def start = testStartNanos.remove(descriptor)
        if (start == null) {
            return
        }
        long durationMs = (System.nanoTime() - start) / 1_000_000L
        testDurationsMs << [name: "${descriptor.className}.${descriptor.name}", ms: durationMs]
        if (durationMs > slowTestThresholdMs) {
            logger.warn(
                    "SLOW TEST (${durationMs}ms, over the ${slowTestThresholdMs}ms tracking "
                            + "threshold): ${descriptor.className}.${descriptor.name}")
        }

        def key = "${descriptor.className}.${descriptor.name}"
        testAttemptOutcomes.putIfAbsent(key, new java.util.concurrent.ConcurrentLinkedQueue())
        def bucket = testAttemptOutcomes.get(key)
        bucket << result.resultType.toString()
    }

    doLast {
        def sorted = testDurationsMs.toList().sort { -it.ms }
        def reportFile = layout.buildDirectory.file("reports/tests/test/timings.txt").get().asFile
        reportFile.parentFile.mkdirs()
        def header = "Slowest tests (of ${sorted.size()} total), sorted descending by duration:\n\n"
        def lines = sorted.collect { "${it.ms}ms\t${it.name}" }.join("\n")
        reportFile.text = header + lines + "\n"
        logger.lifecycle("Test timing report written to ${reportFile}")
        if (!sorted.isEmpty()) {
            logger.lifecycle("Slowest test: ${sorted[0].ms}ms - ${sorted[0].name}")
        }

        def flaky = testAttemptOutcomes.findAll { name, outcomes ->
            outcomes.size() > 1 && outcomes.toSet().size() > 1
        }
        def flakyReportFile = layout.buildDirectory.file("reports/tests/test/flaky.txt").get().asFile
        if (flaky.isEmpty()) {
            flakyReportFile.text =
                    "No flaky tests detected in this run (no test's attempts disagreed).\n"
        } else {
            def body = flaky.collect { name, outcomes -> "${name}: attempts=${outcomes}" }.join("\n")
            flakyReportFile.text = "Flaky tests detected this run:\n\n${body}\n"
            logger.warn("FLAKY TEST(S) DETECTED - see ${flakyReportFile}")
        }
    }
}

// Required by Harness CI Test Intelligence (TI) so it can inject its call-graph
// agent into the forked test JVM and safely filter to a subset of tests without
// failing when a given subproject has none of the selected tests.
// https://developer.harness.io/continuous-integration/troubleshooting-and-resources/ci-articles-and-faqs/articles/gradle-daemon#gradle-version-not-compatible-with-test-intelligence
tasks.withType(Test) {
    if (System.getProperty("HARNESS_JAVA_AGENT")) {
        jvmArgs += [System.getProperty("HARNESS_JAVA_AGENT")]
    }
}

gradle.projectsEvaluated {
    tasks.withType(Test) {
        filter {
            setFailOnNoMatchingTests(false)
        }
    }
}
