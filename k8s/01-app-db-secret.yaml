# The database is external to this cluster (see the "postgresdb" Harness
# connector). Harness resolves the <+secrets.getValue(...)> expression in
# values.yaml against its secret manager at deploy time and Go-templates
# the real value in here - it never lands in this file or git history.
# (Harness only resolves <+...> expressions in values.yaml, not directly
# inside manifests - hence the {{ .Values.x }} indirection here.)
apiVersion: v1
kind: Secret
metadata:
  name: mockingbird-db-credentials
  namespace: mockingbird-bank
type: Opaque
data:
  SPRING_DATASOURCE_USERNAME: {{ .Values.dbUsername | b64enc }}
  SPRING_DATASOURCE_PASSWORD: {{ .Values.dbPassword | b64enc }}
