# The database is external to this cluster (see the "postgresdb" Harness
# connector). Harness resolves the <+secrets.getValue(...)> expression
# against its secret manager at deploy time and applies the real value -
# the plaintext password never touches this file or git history.
apiVersion: v1
kind: Secret
metadata:
  name: mockingbird-db-credentials
  namespace: mockingbird-bank
type: Opaque
stringData:
  SPRING_DATASOURCE_USERNAME: admin
  SPRING_DATASOURCE_PASSWORD: <+secrets.getValue("postgres-lab-secret")>
