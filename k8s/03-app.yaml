apiVersion: apps/v1
kind: Deployment
metadata:
  name: mockingbird-app
  namespace: mockingbird-bank
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mockingbird-app
  template:
    metadata:
      labels:
        app: mockingbird-app
    spec:
      containers:
        - name: app
          # Go-templated from values.yaml (Harness only resolves <+...>
          # expressions there, not directly inside manifests) - resolves to
          # the artifact from the Service's artifact source at deploy time.
          image: {{ .Values.image }}
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: mockingbird-app-config
          env:
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mockingbird-db-credentials
                  key: SPRING_DATASOURCE_USERNAME
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mockingbird-db-credentials
                  key: SPRING_DATASOURCE_PASSWORD
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: mockingbird-app
  namespace: mockingbird-bank
spec:
  selector:
    app: mockingbird-app
  ports:
    - port: 80
      targetPort: 8080
  type: ClusterIP
