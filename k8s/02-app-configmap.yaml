apiVersion: v1
kind: ConfigMap
metadata:
  name: mockingbird-app-config
  namespace: mockingbird-bank
data:
  # External Postgres instance - see the "postgresdb" Harness connector.
  # This is not a Secret because a JDBC host/port/db name isn't sensitive.
  # Dedicated database for this app (not the shared "metamanagement" DB) -
  # must exist on the Postgres server before Flyway can create tables in it.
  SPRING_DATASOURCE_URL: jdbc:postgresql://192.168.0.148:5432/mockingbirdbank
